<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ses ile Görsel Aktarımı</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1a1a1a;--card:#f2f3f5;--ac:#3b6cf6}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e8e8;--card:#22252b;--ac:#7c9dff}}
body{margin:0;padding:14px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:560px;margin:auto}
section{background:var(--card);border-radius:14px;padding:14px;margin:14px 0}
h1{font-size:20px}h2{font-size:16px;margin:0 0 8px}
label{display:block;margin:8px 0}input[type=range]{width:100%}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;margin:6px 6px 6px 0}
canvas{width:100%;image-rendering:pixelated;background:#8883;border-radius:8px;display:block;margin:8px 0}
#bar{height:16px;background:#8884;border-radius:8px;overflow:hidden;margin:6px 0}#bi{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
small,p{opacity:.85}a{color:var(--ac)}
</style></head><body>
<h1>🔊 Ses ile Görsel Aktarımı</h1>
<small>Her piksel rengi 16×16 renk düzleminde (x,y) bir değere, o da iki duyulamayan frekansa çevrilir. Aynı/yakın renkler tek simge + tekrar sayısıyla gider. Beyaz = (0,0).</small>
<label>Frekans bandı (iki telefonda de aynı olmalı): <select id="bd"><option value="a" selected>Duyulabilir 2–5 kHz (önce bununla test et)</option><option value="m">Yüksek 14–17 kHz</option><option value="u">Ultrason 19–22 kHz</option></select></label>


<section><h2>📤 Gönder</h2>
<input type="file" id="f" accept="image/*">
<label>Çözünürlük (uzun kenar): <b id="vs">48</b> px<input type="range" id="sz" min="16" max="160" value="48"></label>
<label>Yakın renk eşiği: <b id="vt">24</b> (yüksek = daha kısa, daha sade)<input type="range" id="tl" min="0" max="120" value="24"></label>
<label>Tekrar sayısı: <select id="rp"><option>1</option><option selected>2</option><option>3</option></select> &nbsp; Ses: <input type="range" id="vol" min="10" max="100" value="70" style="width:40%"></label>
<canvas id="pv" width="1" height="1"></canvas>
<p id="info">Bir görsel seçin.</p>
<button id="send">📤 Gönder</button><button id="tt">🔔 Test tonu çal</button></section>

<section><h2>📥 Al</h2>
<button id="rec">📥 Dinle</button>
<canvas id="rv" width="1" height="1"></canvas>
<div id="bar"><i id="bi"></i></div>
<p id="st">Hazır.</p><p id="lv"></p>
<a id="dl" download="gorsel.png">PNG olarak indir</a></section>

<script>
const $=i=>document.getElementById(i);
const BANDS={a:{x:2000,y:3800,s:100,f:5600,c0:1800,c1:5800},m:{x:14000,y:15400,s:80,f:16800,c0:13800,c1:17000},u:{x:19000,y:20400,s:80,f:21800,c0:18800,c1:22000}};let BN=BANDS.a;
const XB=x=>BN.x+x*BN.s,YB=y=>BN.y+y*BN.s,PRE=.5,TONE=.16,STEP=.25,MAXN=40,AC=window.AudioContext||window.webkitAudioContext;
let src=null,pk=[],W=0,H=0,uc=null,nodes=[],tm=null,rx=null;
/* renk: 3-3-2 bit, ters çevrilmiş (beyaz=255-255=0 → x=0,y=0); bayt = x<<4 | y */
const dec=c=>{const r=255-c;return [(r>>5)*255/7,((r>>2)&7)*255/7,(r&3)*85]};
$('f').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const im=new Image();im.onload=()=>{src=im;build()};im.src=URL.createObjectURL(fl)};
$('sz').oninput=()=>{$('vs').textContent=$('sz').value;build()};
$('tl').oninput=()=>{$('vt').textContent=$('tl').value;build()};
$('rp').onchange=build;
function build(){
  if(!src)return;
  const sc=+$('sz').value/Math.max(src.width,src.height);
  W=Math.max(1,Math.round(src.width*sc));H=Math.max(1,Math.round(src.height*sc));
  const c=$('pv'),g=c.getContext('2d',{willReadFrequently:true});c.width=W;c.height=H;
  g.drawImage(src,0,0,W,H);
  const d=g.getImageData(0,0,W,H),N=W*H,tol=+$('tl').value,codes=new Uint8Array(N);let run=null;
  for(let i=0;i<N;i++){
    const R=Math.round(d.data[i*4]*7/255),G=Math.round(d.data[i*4+1]*7/255),B=Math.round(d.data[i*4+2]*3/255);
    const q=[R*255/7,G*255/7,B*85];
    if(!run||Math.abs(q[0]-run.q[0])+Math.abs(q[1]-run.q[1])+Math.abs(q[2]-run.q[2])>tol)run={q,c:255-((R<<5)|(G<<2)|B)};
    codes[i]=run.c;
    d.data.set([...dec(run.c),255],i*4);
  }
  g.putImageData(d,0,0);
  pk=[];let cur={off:0,sy:[]},pos=0,i=0,tk=0;
  while(i<N){
    const c0=codes[i];let j=i;while(j<N&&codes[j]===c0&&j-i<256)j++;
    const len=j-i,sy=len>=3?[[c0,1],[len-1,0]]:Array.from({length:len},()=>[c0,0]);
    if(cur.sy.length+sy.length>MAXN){pk.push(cur);cur={off:pos,sy:[]}}
    cur.sy.push(...sy);pos+=len;i=j;tk++;
  }
  pk.push(cur);
  const sec=pk.reduce((a,p)=>a+PRE+.3+(p.sy.length+7)*STEP+.6,0)*(+$('rp').value);
  $('info').textContent=W+'×'+H+' piksel · '+tk+' grup · '+pk.length+' paket · tahmini süre '+(sec<90?Math.round(sec)+' sn':(sec/60).toFixed(1)+' dk');
}
function ac(){
  if(!uc){try{uc=new AC({sampleRate:48000})}catch(e){uc=new AC()}}
  if(uc.state==='suspended')uc.resume();
}
function tone(f,t,v){
  const o=uc.createOscillator(),g=uc.createGain();o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);
  g.gain.setValueAtTime(v,t+TONE-.01);g.gain.linearRampToValueAtTime(0,t+TONE);
  o.connect(g).connect(uc.destination);o.start(t);o.stop(t+TONE+.02);nodes.push(o);
}
function chirp(t,v){
  const o=uc.createOscillator(),g=uc.createGain();
  o.frequency.setValueAtTime(BN.c0,t);o.frequency.linearRampToValueAtTime(BN.c1,t+PRE);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);
  g.gain.setValueAtTime(v,t+PRE-.02);g.gain.linearRampToValueAtTime(0,t+PRE);
  o.connect(g).connect(uc.destination);o.start(t);o.stop(t+PRE+.02);nodes.push(o);
}
function stopTx(){nodes.forEach(o=>{try{o.stop()}catch(e){}});nodes=[];clearTimeout(tm);$('send').textContent='📤 Gönder'}
/* paket: [w,h,ofsüst,ofsalt,n, ...simgeler, sağlama] */
function pktSyms(p){
  const a=[W,H,p.off>>8,p.off&255,p.sy.length].map(b=>[b,0]).concat(p.sy);let ch=0;
  a.forEach((s,i)=>ch+=((s[1]<<8)|s[0])*(i+1));let c2=0;a.forEach((s,i)=>c2+=((s[1]<<8)|s[0])*(i*i+7));a.push([ch&255,0],[c2%253,0]);return a;
}
$('send').onclick=()=>{
  if(nodes.length){stopTx();$('info').textContent='Gönderim durduruldu.';return}
  if(!pk.length){$('info').textContent='Önce bir görsel seçin.';return}
  ac();BN=BANDS[$('bd').value];
  if(uc.sampleRate/2<BN.c1+300){$('info').textContent='Bu cihaz 48 kHz ses çalamıyor, gönderemez.';return}
  const v=Math.pow($('vol').value/100,2)*.2,rep=+$('rp').value;let t=uc.currentTime+.3;
  for(let r=0;r<rep;r++)for(const p of pk){
    chirp(t,v);const s=pktSyms(p);
    s.forEach((q,i)=>{const t0=t+PRE+.3+i*STEP;tone(XB(q[0]>>4),t0,v);tone(YB(q[0]&15),t0,v);if(q[1])tone(BN.f,t0,v)});
    t+=PRE+.3+s.length*STEP+.6;
  }
  const total=t-uc.currentTime;$('send').textContent='■ Durdur';
  $('info').textContent='Gönderiliyor… ('+(total<90?Math.round(total)+' sn':(total/60).toFixed(1)+' dk')+'). Diğer telefonda "Dinle" açık olsun.';
  tm=setTimeout(()=>{nodes=[];$('send').textContent='📤 Gönder';$('info').textContent='Gönderildi.'},total*1000);
};

$('tt').onclick=()=>{
  if(nodes.length){stopTx();return}
  ac();BN=BANDS[$('bd').value];
  if(uc.sampleRate/2<BN.c1+300){$('info').textContent='Bu cihaz bu bandı çalamıyor.';return}
  const o=uc.createOscillator(),g=uc.createGain();o.frequency.value=BN.f;g.gain.value=Math.pow($('vol').value/100,2)*.4;
  o.connect(g).connect(uc.destination);o.start();o.stop(uc.currentTime+6);nodes.push(o);$('send').textContent='■ Durdur';
  $('info').textContent='Test tonu çalıyor (6 sn). Alıcıda "test tonu" değeri +10 dB üstüne çıkmalı.';
  tm=setTimeout(()=>{nodes=[];$('send').textContent='📤 Gönder';$('info').textContent='Test tonu bitti.'},6000);
};
function stopRx(msg){
  if(!rx)return;clearInterval(rx.iv);
  try{rx.sp.onaudioprocess=null;rx.sp.disconnect();rx.stream.getTracks().forEach(t=>t.stop());rx.rc.close()}catch(e){}
  rx=null;$('rec').textContent='📥 Dinle';if(msg)$('st').textContent=msg;
}
$('rec').onclick=async()=>{
  if(rx){stopRx('Dinleme durduruldu.');return}
  BN=BANDS[$('bd').value];let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){$('st').textContent='Mikrofon izni gerekli.';return}
  let rc;try{rc=new AC({sampleRate:48000})}catch(e){rc=new AC()}
  if(rc.state==='suspended')rc.resume();
  const sr=rc.sampleRate;
  if(sr/2<BN.c1+300){stream.getTracks().forEach(t=>t.stop());rc.close();$('st').textContent='Bu cihaz 48 kHz ses kaydedemiyor.';return}
  const cap=sr*60|0,buf=new Float32Array(cap),sp=rc.createScriptProcessor(4096,1,1),mu=rc.createGain();
  let n=0;mu.gain.value=0;
  sp.onaudioprocess=e=>{const d=e.inputBuffer.getChannelData(0),k=Math.min(d.length,cap-n);buf.set(d.subarray(0,k),n);n+=k};
  rc.createMediaStreamSource(stream).connect(sp);sp.connect(mu);mu.connect(rc.destination);
  /* chirp şablonu (kos + sin) */
  const TS=4,L=Math.round(PRE*sr),NT=Math.floor(L/TS),tc=new Float32Array(NT),ts=new Float32Array(NT);let Ec=0;
  for(let j=0;j<NT;j++){const q=j*TS/sr,ph=2*Math.PI*(BN.c0*q+(BN.c1-BN.c0)*q*q/(2*PRE));tc[j]=Math.cos(ph);ts[j]=Math.sin(ph);Ec+=tc[j]*tc[j]}
  const ncc=p=>{let a=0,b=0,e=0;for(let j=0;j<NT;j++){const x=buf[p+j*TS];a+=x*tc[j];b+=x*ts[j];e+=x*x}return Math.sqrt(a*a+b*b)/Math.sqrt(e*Ec+1e-12)};
  const gz=(a,e,f)=>{const w=2*Math.cos(2*Math.PI*f/sr);let s1=0,s2=0;for(let i=a;i<e;i++){const s=buf[i]+w*s1-s2;s2=s1;s1=s}return s1*s1+s2*s2-w*s1*s2};
  let lastQ=0,nOk=0,nBad=0,bestN=0,sp0=0,cand=null,pend=[],W2=0,H2=0,pix=null,got=null,cnt=0;
  function scan(){
    while(sp0+L<=n){
      const v=ncc(sp0);if(v>bestN)bestN=v;
      if(v>.12&&(!cand||v>cand.v))cand={p:sp0,v};
      if(cand&&sp0>cand.p+.25*sr){pend.push({s:cand.p});sp0=cand.p+L;cand=null;continue}
      sp0+=16;
    }
  }
  function paint(){
    const c=$('rv'),g=c.getContext('2d');c.width=W2;c.height=H2;const d=g.createImageData(W2,H2);
    for(let i=0;i<W2*H2;i++)d.data.set(got[i]?[...dec(pix[i]),255]:[128,128,128,255],i*4);
    g.putImageData(d,0,0);$('dl').href=c.toDataURL();
  }
  const att={},chk=(S,m)=>{let a=0,b=0;for(let i=0;i<m+5;i++){const v=(S[i][1]<<8)|S[i][0];a+=v*(i+1);b+=v*(i*i+7)}return (a&255)===S[m+5][0]&&b%253===S[m+6][0]};
  function tryFrame(fr){
    const sym=i=>{
      const a=fr.s+Math.round((PRE+.3+i*STEP+TONE*.2)*sr),e=fr.s+Math.round((PRE+.3+i*STEP+TONE*.8)*sr);
      if(e>n)return null;
      const px=Array.from({length:16},(_,k)=>gz(a,e,XB(k))),py=Array.from({length:16},(_,k)=>gz(a,e,YB(k)));
      const mx=Math.max(...px),my=Math.max(...py);
      const sx=[...px].sort((u,t)=>t-u),sy=[...py].sort((u,t)=>t-u);return [(px.indexOf(mx)<<4)|py.indexOf(my),gz(a,e,BN.f)>.3*(mx+my)/2?1:0,Math.min(sx[0]/(sx[1]+1e-12),sy[0]/(sy[1]+1e-12))];
    };
    const s=[];
    for(let i=0;i<5;i++){const q=sym(i);if(!q)return 'wait';s.push(q)}
    let [w,h,oh,ol,m]=s.map(q=>q[0]);
    if(!w||!h||m<1||m>MAXN)return 'bad';
    for(let i=5;i<m+7;i++){const q=sym(i);if(!q)return 'wait';s.push(q)}
    
    lastQ=s.map(q=>q[2]).sort((a,b)=>a-b)[s.length>>1];
    let S=s;
    if(!chk(S,m)){
      /* bozuk paket: aynı paketin önceki tekrarlarıyla simge simge, ton netliğine göre oylama */
      const key=((oh<<8)|ol)+':'+m,A=(att[key]=att[key]||[]);A.push(s);if(A.length>6)A.shift();
      if(A.length<2)return 'bad';
      S=A[0].map((_,i)=>{const sc={};A.forEach(a=>{const k=a[i][0]*2+a[i][1];sc[k]=(sc[k]||0)+Math.min(a[i][2],50)+1});const k=+Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0];return [k>>1,k&1]});
      if(!chk(S,m))return 'bad';
      delete att[key];
    }
    w=S[0][0];h=S[1][0];if(!w||!h)return 'bad';
    if(w!==W2||h!==H2){W2=w;H2=h;pix=new Uint8Array(w*h);got=new Uint8Array(w*h);cnt=0}
    let pos=(oh<<8)|ol,i=5;
    while(i<m+5){
      const q=S[i];let run=1;
      if(q[1]){if(i+1>=m+5)return 'bad';run=S[i+1][0]+1;i+=2}else i++;
      for(let k=0;k<run;k++,pos++)if(pos<w*h){if(!got[pos]){got[pos]=1;cnt++}pix[pos]=q[0]}
    }
    paint();return 'ok';
  }
  const iv=setInterval(()=>{
    scan();if(!rx)return;
    {const tn=Math.min(n,Math.round(.3*sr)),a0=n-tn;
    if(tn>1000){let q=0;for(let i=a0;i<n;i++)q+=buf[i]*buf[i];
      const pt=gz(a0,n,BN.f),rf=[-700,-500,500,700].map(d=>gz(a0,n,BN.f+d)).reduce((x,y)=>x+y,0)/4,db=10*Math.log10((pt+1e-12)/(rf+1e-12));
      $('lv').textContent='Mikrofon '+(10*Math.log10(q/tn+1e-12)).toFixed(0)+' dB · test tonu '+(db>=0?'+':'')+db.toFixed(0)+' dB · chirp eşleşme %'+Math.round(bestN*100)+' · paket kabul '+nOk+' / red '+nBad+' · ton netliği '+Math.round(lastQ)+'×'}}
    pend=pend.filter(fr=>{const r=tryFrame(fr);if(r==='ok')nOk++;if(r==='bad')nBad++;return r==='wait'});
    $('bi').style.width=(W2?cnt*100/(W2*H2):0)+'%';
    $('st').textContent=W2?'Dinleniyor… %'+Math.round(cnt*100/(W2*H2))+' ('+cnt+'/'+W2*H2+' piksel)':'Dinleniyor… ön ek (chirp) bekleniyor';
    if(W2&&cnt===W2*H2){stopRx('Görsel tamamlandı ✓ ('+W2+'×'+H2+')');return}
    const k=Math.min(sp0,...pend.map(f=>f.s));
    if(k>sr*5&&n>cap*.5){buf.copyWithin(0,k,n);n-=k;sp0-=k;pend.forEach(f=>f.s-=k);if(cand)cand.p-=k}
  },700);
  rx={iv,stream,rc,sp};$('rec').textContent='■ Dinlemeyi durdur';$('st').textContent='Dinleniyor… ön ek (chirp) bekleniyor';
};
</script></body></html>
